<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Calculadora em JavaScript</title>
  <desc id="desc">Prévia da calculadora feita com HTML, CSS e JavaScript, com visor e botões numéricos e de operações.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0eee9"/>
      <stop offset="1" stop-color="#dad8d2"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#827b71"/>
      <stop offset="1" stop-color="#625c54"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#24211d" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="1028" cy="140" r="214" fill="#ec9718" opacity=".09"/>
  <circle cx="120" cy="680" r="170" fill="#757166" opacity=".08"/>
  <text x="600" y="76" text-anchor="middle" fill="#20201e" font-family="Arial, sans-serif" font-size="34" font-weight="700">Calculadora</text>
  <text x="600" y="108" text-anchor="middle" fill="#6d6b64" font-family="monospace" font-size="13" letter-spacing="2">HTML · CSS · JAVASCRIPT</text>

  <g filter="url(#shadow)">
    <rect x="391" y="139" width="418" height="551" rx="30" fill="url(#body)"/>
    <rect x="416" y="164" width="368" height="74" rx="19" fill="#c4bebe"/>
    <text x="752" y="215" text-anchor="end" fill="#171614" font-family="Arial, sans-serif" font-size="34" font-weight="500">32</text>

    <g font-family="Arial, sans-serif" font-size="25" font-weight="600" text-anchor="middle">
      <g fill="#f4f2ed">
        <rect x="416" y="256" width="79" height="66" rx="23"/><rect x="506" y="256" width="79" height="66" rx="23"/>
        <rect x="416" y="334" width="79" height="66" rx="23"/><rect x="506" y="334" width="79" height="66" rx="23"/><rect x="596" y="334" width="79" height="66" rx="23"/>
        <rect x="416" y="412" width="79" height="66" rx="23"/><rect x="506" y="412" width="79" height="66" rx="23"/><rect x="596" y="412" width="79" height="66" rx="23"/>
        <rect x="416" y="490" width="79" height="66" rx="23"/><rect x="506" y="490" width="79" height="66" rx="23"/><rect x="596" y="490" width="79" height="66" rx="23"/>
        <rect x="416" y="568" width="79" height="66" rx="23"/><rect x="506" y="568" width="79" height="66" rx="23"/><rect x="596" y="568" width="79" height="66" rx="23"/>
      </g>
      <g fill="#96948a"><rect x="416" y="256" width="79" height="66" rx="23"/></g>
      <g fill="#ec9718">
        <rect x="596" y="256" width="79" height="66" rx="23"/>
        <rect x="686" y="256" width="79" height="66" rx="23"/>
        <rect x="686" y="334" width="79" height="66" rx="23"/>
        <rect x="686" y="412" width="79" height="66" rx="23"/>
        <rect x="686" y="490" width="79" height="66" rx="23"/>
        <rect x="686" y="568" width="79" height="66" rx="23"/>
      </g>
      <g fill="#1d1c19">
        <text x="455" y="298">X</text><text x="545" y="298">C</text><text x="635" y="298">=</text><text x="725" y="298">+</text>
        <text x="455" y="376">7</text><text x="545" y="376">8</text><text x="635" y="376">9</text><text x="725" y="376">-</text>
        <text x="455" y="454">4</text><text x="545" y="454">5</text><text x="635" y="454">6</text><text x="725" y="454">*</text>
        <text x="455" y="532">1</text><text x="545" y="532">2</text><text x="635" y="532">3</text><text x="725" y="532">/</text>
        <text x="455" y="610">.</text><text x="545" y="610">0</text><text x="635" y="610">,</text><text x="725" y="610">%</text>
      </g>
    </g>
  </g>
  <text x="600" y="728" text-anchor="middle" fill="#6d6b64" font-family="Arial, sans-serif" font-size="14">Gustavo Fernandes</text>
</svg>

